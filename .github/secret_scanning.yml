# GitHub secret scanning: skip the encrypted study packs.
# Each file in p/ is one block of ciphertext about a million characters long, so a run that happens to look
# like an API key turns up by chance now and then (first alert: "Google API Key", 2026-11-12). Nothing in p/
# is ever a real key. The rest of the site is still scanned.
paths-ignore:
  - "p/**"
